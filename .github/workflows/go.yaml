name: Go

on:
  push:
    branches: [ main, v3, v2, v1, cra-demo ]
  pull_request:
    branches: [ main, v3, v2, v1 ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    needs: go-versions
    continue-on-error: true  # make sure to run all versions, even if one fails

    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(needs.go-versions.outputs.versions) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with: {persist-credentials: false}

    - name: Run all unit tests w/ -cover, all YTS tests and go lint
      run: make test lint v=1 cover=1 GO-VERSION=${{ matrix.go-version }}

    - name: Generate SBOM with Syft
      continue-on-error: true
      run: make sbom

    - name: Build CLI binary
      run: make cli GO-VERSION=${{ matrix.go-version }}

    - name: Install Cosign
      uses: sigstore/cosign-installer@d7d6bc7722e3dedc6edbc0ea725da64afd1adc04  # v3.8.1

    - name: Attest build artifact with Cosign
      env:
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        IMAGE_NAME: ghcr.io/aaronbronow/go-yaml:v4.0.0-rc.6
      run: |
        if [ "${GITHUB_REF_TYPE:-}" = 'tag' ]; then
          IMAGE_NAME="ghcr.io/aaronbronow/go-yaml:${GITHUB_REF_NAME}"
        fi
        echo "Target attestation image: $IMAGE_NAME"
        echo 'Checking GHCR credentials for remote image attestation...'
        AUTHENTICATED=false
        if [ -n "$GHCR_TOKEN" ]; then
          if echo "$GHCR_TOKEN" | docker login ghcr.io -u aaronbronow --password-stdin 2>/dev/null; then
            AUTHENTICATED=true
          fi
        fi

        if [ "$AUTHENTICATED" = 'true' ]; then
          echo "GHCR credentials verified. Attesting $IMAGE_NAME with SPDX SBOM predicate..."
          cosign attest --yes --predicate sbom.spdx.json --type spdx "$IMAGE_NAME" || {
            echo '::warning::Remote image attestation failed. Falling back to offline dry-run attestation.'
            AUTHENTICATED=false
          }
        fi

        if [ "$AUTHENTICATED" != 'true' ]; then
          echo '::warning::GHCR credentials not configured or remote image not found. Running offline dry-run attestation.'
          echo 'Generating offline in-toto attestation bundle for go-yaml CLI binary...'
          COSIGN_PASSWORD='' cosign generate-key-pair
          export COSIGN_PASSWORD=''
          cosign attest-blob \
            --yes \
            --key cosign.key \
            --predicate sbom.spdx.json \
            --type spdx \
            --output-attestation attestation.json \
            ./go-yaml

          echo '=== OFFLINE IN-TOTO ATTESTATION DUMP ==='
          jq . attestation.json 2>/dev/null || cat attestation.json
          echo '========================================'
          rm -f cosign.key cosign.pub
        fi

    - name: Upload SBOM and Attestation artifacts
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
      with:
        name: sbom-and-attestation-${{ matrix.go-version }}
        path: |
          sbom.spdx.json
          attestation.json
        if-no-files-found: ignore

  test-cross-platform:
    name: Test on ${{ matrix.GOOS }}/${{ matrix.GOARCH }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true  # make sure to run all platforms, even if one fails

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          GOOS: darwin
          GOARCH: amd64
          test-args: -race
        - os: macos-latest
          GOOS: darwin
          GOARCH: arm64
          test-args: -race
        - os: windows-latest
          GOOS: windows
          GOARCH: amd64
          test-args: -race
        - os: ubuntu-latest
          GOOS: linux
          GOARCH: 386
          test-args: ''  # race is not available on 32 bits architecture
        - os: windows-latest
          GOOS: windows
          GOARCH: 386
          test-args: ''  # race is not available on 32 bits architecture

    env:
      GOARCH: ${{ matrix.GOARCH }}
      GOOS: ${{ matrix.GOOS }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with: {persist-credentials: false}

    - name: Run tests
      run: |
        bash -c 'echo + $OSTYPE + $MACHTYPE +'
        make test-main test-internal v=1 o=${{ matrix.test-args }}

  go-versions:
    name: Lookup Go versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.latest-patch-versions.outputs.matrix }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Get latest patch for each minor version
      # yamllint disable-line rule:line-length
      uses: arnested/go-version-action@697236828ba755d1949ca46316abf0b4d9f6a205  # v2.1.6
      id: latest-patch-versions
      with:
        latest-patches-only: true
        patch-level: true
